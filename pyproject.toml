[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "slow: тесты, требующие LLM вызова (пропускаются по умолчанию)",
    "integration: интеграционные тесты (требуют базу данных)",
    "unit: изолированные unit-тесты",
]

[tool.coverage.run]
source = ["agents", "database", "emotional_core.py", "brain_unified.py", "mobile_api.py"]
omit = ["*/venv_local/*", "*/venv/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Стартуем с безопасного набора: ловит реальные баги (F821 undefined name),
# не ругается на стиль, чтобы CI был зелёным с первого дня.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
