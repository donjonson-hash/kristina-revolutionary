name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feature/**']
  workflow_dispatch:

jobs:
  lint:
    name: Lint and Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # полная история нужна сканеру секретов

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        # набор E4,E7,E9,F ловит F821 undefined name (как self.tiggers)
        run: ruff check agents database *.py

      - name: Secret scan history
        run: bash scripts/check_history_secrets.sh

      - name: Compile check
        run: python -m compileall -q agents database *.py

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest tests/ -v

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Browser interface integration
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Offline extension parity and integration
        run: node --test tests/extension/*.test.*

      - name: Build browser extensions
        run: python scripts/build_reconciliation_extension.py

      - uses: actions/upload-artifact@v4
        with:
          name: historical-kristina-browser-extensions-0.18.1
          path: dist/extension/*.zip
