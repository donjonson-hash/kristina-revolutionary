name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feature/**']
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Compile check
        run: python -m compileall -q agents database *.py

      - name: Run tests
        run: python -m pytest tests/ -v

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Browser interface integration
        working-directory: tests/browser
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Offline extension parity and integration
        run: node --test tests/extension/*.test.*

      - name: Build browser extensions
        run: python scripts/build_reconciliation_extension.py

      - uses: actions/upload-artifact@v4
        with:
          name: kristina-browser-extensions
          path: dist/extension/*.zip
