name: kristina_app
description: Kristina AI Assistant Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # HTTP и WebSocket
  dio: ^5.4.0
  web_socket_channel: ^2.4.0
  
  # Состояние
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9
  
  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # Утилиты
  shared_preferences: ^2.2.2
  jwt_decoder: ^2.0.1
  intl: ^0.18.1
  file_picker: ^8.0.0
  image_picker: ^1.0.7
  
  # Локация (для Стокгольма)
  geolocator: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
